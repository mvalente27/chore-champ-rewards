workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - keystore_reference
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "app.lovable.063c78be35aa476f86045287f25be1f2"
        ADMOB_APP_ID: "ca-app-pub-4921015020988476~7394189413"
      node: 18
      java: 17
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Add Android platform
        script: |
          npx cap add android || true
      
      - name: Configure AdMob in AndroidManifest
        script: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
            sed -i '' 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'"/>\n    </application>|' "$MANIFEST_PATH"
          fi
      
      - name: Build web assets
        script: |
          npm run build
      
      - name: Sync Capacitor
        script: |
          npx cap sync android
      
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      
      - name: Build Android Release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      
      - name: Build Android Release APK
        script: |
          cd android
          ./gradlew assembleRelease
    
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - michael.valente1@gmail.com
        notify:
          success: true
          failure: true
      
      # Uncomment below to enable auto-publish to Play Store
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal  # Options: internal, alpha, beta, production
      #   submit_as_draft: true

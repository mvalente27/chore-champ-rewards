workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - keystore_reference
      groups:
        - android_credentials
      vars:
        # Must match Capacitor appId (valid Java package name)
        PACKAGE_NAME: "com.lovable.chorequest"
        ADMOB_APP_ID: "ca-app-pub-4921015020988476~7394189413"
      node: 22.13.0
      java: 21
      xcode: latest
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    
    scripts:
      - name: Install dependencies
        script: |
          npm install
      
      - name: Build web assets
        script: |
          npm run build
      
      - name: Add Android platform
        script: |
          npx cap add android
      
      - name: Sync Capacitor
        script: |
          npx cap sync android
      
      - name: Configure AdMob in AndroidManifest
        script: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            # Add AD_ID permission for Android 13+ (required for AdMob)
            if ! grep -q "com.google.android.gms.permission.AD_ID" "$MANIFEST_PATH"; then
              /usr/bin/perl -0777 -i -pe 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #s unless /<manifest.*xmlns:tools/' "$MANIFEST_PATH"
              /usr/bin/perl -0777 -i -pe 's#(<manifest[^>]*>)#$1\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>#s' "$MANIFEST_PATH"
            fi
            # Add AdMob App ID meta-data
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
              /usr/bin/perl -0777 -i -pe 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'"/>\n    </application>#s' "$MANIFEST_PATH"
            fi
          else
            echo "Error: AndroidManifest.xml not found"
            exit 1
          fi
      
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      
      - name: Configure release signing and versioning
        script: |
          # Update versionCode using Codemagic build number
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD_NUMBER\"/" android/app/build.gradle
          
          # Add signing config to app/build.gradle
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH") ?: "/tmp/keystore.jks")
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: ""
                      keyAlias System.getenv("CM_KEY_ALIAS") ?: ""
                      keyPassword System.getenv("CM_KEY_PASSWORD") ?: ""
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      
      - name: Build Android Release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      
      - name: Build Android Release APK
        script: |
          cd android
          ./gradlew assembleRelease
    
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - michael.valente1@gmail.com
        notify:
          success: true
          failure: true
      
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true  # Set to false to auto-release without review
